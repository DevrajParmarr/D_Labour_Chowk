services:
  - type: web
    name: d-labour-chowk
    runtime: docker
    plan: free
    buildCommand: docker build -t d-labour-chowk .
    startCommand: docker run -p $PORT:10000 d-labour-chowk
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: d-labour-db
          property: connectionString
      - key: RENDER_POSTGRESQL_HOST
        fromDatabase:
          name: d-labour-db
          property: host
      - key: RENDER_POSTGRESQL_USER
        fromDatabase:
          name: d-labour-db
          property: user
      - key: RENDER_POSTGRESQL_PASSWORD
        fromDatabase:
          name: d-labour-db
          property: password
      - key: RENDER_POSTGRESQL_DATABASE
        fromDatabase:
          name: d-labour-db
          property: database
      - key: RENDER_POSTGRESQL_PORT
        fromDatabase:
          name: d-labour-db
          property: port
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: d-labour-chowk
          property: host
      - key: PORT
        generateValue: true

  - type: pserv
    name: d-labour-db
    runtime: postgres
    plan: free
    envVars:
      - key: POSTGRES_DB
        value: d_labour
      - key: POSTGRES_USER
        value: d_labour_user
      - key: POSTGRES_PASSWORD
        generateValue: true