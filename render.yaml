services:
  - type: web
    name: d-labour-chowk
    runtime: docker
    plan: free
    buildCommand: docker build -t d-labour-chowk .
    startCommand: docker run -p $PORT:80 d-labour-chowk
    envVars:
      - key: DB_HOST
        value: d-labour-db
      - key: DB_USERNAME
        value: d_labour_user
      - key: DB_PASSWORD
        value: your_mysql_password_here  # Replace with the actual password from the database service
      - key: DB_NAME
        value: d_labour
      - key: DB_TYPE
        value: mysql
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: d-labour-chowk
          property: host
      - key: PORT
        generateValue: true

  - type: pserv
    name: d-labour-db
    runtime: mysql
    plan: free
    envVars:
      - key: MYSQL_DATABASE
        value: d_labour
      - key: MYSQL_USER
        value: d_labour_user
      - key: MYSQL_PASSWORD
        generateValue: true