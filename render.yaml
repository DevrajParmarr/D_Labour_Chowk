services:
  - type: web
    name: d-labour-chowk
    runtime: docker
    plan: free
    buildCommand: docker build -t d-labour-chowk .
    startCommand: docker run -p $PORT:80 d-labour-chowk
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: d-labour-db
          property: connectionString
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: d-labour-chowk
          property: host
      - key: PORT
        generateValue: true

  - type: pserv
    name: d-labour-db
    runtime: mysql
    plan: free
    envVars:
      - key: MYSQL_DATABASE
        value: d_labour
      - key: MYSQL_USER
        value: d_labour_user
      - key: MYSQL_PASSWORD
        generateValue: true